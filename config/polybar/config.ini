[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 30
background = #1e1e2e
foreground = #cdd6f4
font-0 = DejaVu Sans:size=10;2
modules-left = bspwm
modules-right = audio network date
wm-restack = bspwm
enable-ipc = true
[bar/primary]
inherit = bar/main
modules-right = audio network date tray
[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-background = #45475a
label-focused-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = #6c7086
label-empty-padding = 2
[module/audio]
type = internal/pulseaudio
label-volume = VOL %percentage%%
label-muted = MUTED
click-right = pavucontrol
[module/network]
type = custom/script
exec = nmcli -t -f STATE general
interval = 10
click-left = nm-connection-editor
[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date% %time%
[module/tray]
type = internal/tray
tray-spacing = 8px

