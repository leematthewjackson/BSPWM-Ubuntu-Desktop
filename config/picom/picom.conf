# GLX tested on ThinkPad P53; avoids square border bleed at rounded corners.
backend = "glx";
vsync = true;
shadow = false;
fading = false;

# Native rounded corners; keep panels and fullscreen windows square.
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "fullscreen",
  "class_g = 'Rofi'"
];
